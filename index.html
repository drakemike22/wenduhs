<!DOCTYPE html>
<html>
<head>
        <title>Wenduhs</title>
        <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="desktop">
        
        <div class="desktop-content">

        <h1 class="desktop-title">Wenduhs Desktop</h1>

        </div>

        <button class="desktop-icon">

            <div class="icon-image">🌐</div>
            <span>Browser</span>

        </button>

        <div class="browser-window">

            <div class="browser-titlebar">
                <span>Wenduhs Browser</span>

                <div class="window-controls">
                    <button class="minimize-button">-</button>
                    <button class="close-button">X</button>
                </div>

            </div>

            <div class="browser-content">
                <h2>Welcome to Wenduhs</h2>
                <p>This is the Wenduhs Browser.</p>
            </div>

        </div>

        <div class="taskbar">

            <div class="taskbar-left">
                <button class="start-button">START</button>

                <div class="taskbar-windows"></div>
            </div>

            <div class="taskbar-right">
                <span class="clock">8:35 PM</span>
            </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
